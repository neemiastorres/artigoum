<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Artigo Um</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:20px;
}
.container{
  max-width:720px;
  margin:0 auto;
  background:#fff;
  padding:24px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}
h1{
  text-align:center;
  color:#0B1F3A;
  margin-bottom:6px;
}
.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:20px;
}
.sync{
  background:#eef4ff;
  color:#0B1F3A;
  padding:12px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  margin-bottom:20px;
}
.section{
  margin:24px 0 12px;
  color:#0B1F3A;
  font-size:18px;
  font-weight:bold;
}
label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  color:#333;
}
input,select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  outline:none;
}
input:focus, select:focus{
  border-color:#0B1F3A;
}
.checkbox{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin-top:16px;
}
.checkbox input{
  width:auto;
  margin-top:4px;
}
button{
  width:100%;
  padding:15px;
  margin-top:18px;
  border:none;
  border-radius:10px;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
#btnSalvar{background:#7ED957}
#btnEnviar{background:#0B1F3A}
#btnLimpar{background:#E67E22}
.status{
  margin-top:18px;
  text-align:center;
  font-weight:bold;
  color:#0B1F3A;
}

/* Modal de Sucesso/Alerta em Destaque */
.modal-sucesso {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(11, 31, 58, 0.85);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-sucesso.ativo {
  display: flex;
  animation: popIn 0.3s ease-out forwards;
}

.modal-conteudo {
  background: #ffffff;
  padding: 35px 25px;
  border-radius: 20px;
  text-align: center;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
}

.icone-sucesso {
  width: 75px;
  height: 75px;
  background: #7ED957;
  color: #ffffff;
  font-size: 42px;
  font-weight: bold;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0 auto 20px;
}

.icone-erro {
  background: #C0392B !important;
}

.modal-conteudo h2 {
  color: #0B1F3A;
  font-size: 28px;
  margin-bottom: 12px;
  font-weight: bold;
}

.modal-conteudo p {
  color: #555555;
  font-size: 16px;
  line-height: 1.4;
  margin-bottom: 25px;
}

.btn-fechar-modal {
  width: 100%;
  background: #0B1F3A;
  color: #ffffff;
  border: none;
  padding: 15px;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 0;
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}
</style>

</head>
<body>

<div class="container">

<div class="sync" id="syncStatus">Verificando conexão...</div>

<h1>Artigo Um</h1>
<div class="subtitle">Cadastro Geral Oficial</div>

<form id="cadastroForm">

<div class="section">Dados Pessoais</div>

<label>Nome completo *</label> <input type="text" id="nome" required>

<label>Título de Eleitor</label> <input type="text" id="titulo">

<label>Zona Eleitoral</label> <input type="text" id="zona">

<label>Seção Eleitoral</label> <input type="text" id="secao">

<label>CPF</label> <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">

<label>Data de nascimento *</label> <input type="date" id="nascimento" required>

<label>Nome da mãe *</label> <input type="text" id="mae" required>

<label>Nome do pai</label> <input type="text" id="pai">

<label>Estado civil</label> <select id="estadoCivil">
<option value="">Selecione</option>
<option>Solteiro(a)</option>
<option>Casado(a)</option>
<option>União Estável</option>
<option>Divorciado(a)</option>
<option>Viúvo(a)</option>
</select>

<label>Gênero</label> <select id="genero">
<option value="">Selecione</option>
<option>Masculino</option>
<option>Feminino</option>
<option>Outro</option>
<option>Prefiro não informar</option>
</select>

<div class="section">Endereço</div>

<label>CEP</label> <input type="text" id="cep" placeholder="00000-000" maxlength="9">

<label>Endereço *</label> <input type="text" id="endereco" required>

<label>Número *</label> <input type="text" id="numero" required>

<label>Complemento</label> <input type="text" id="complemento">

<label>Bairro *</label> <input type="text" id="bairro" required>

<label>Cidade *</label> <input type="text" id="cidade" required>

<label>Estado *</label> <input type="text" id="estado" required>

<div class="section">Contato</div>

<label>Telefone</label> <input type="text" id="telefone" placeholder="(00) 0000-0000" maxlength="14">

<label>WhatsApp *</label> <input type="text" id="whatsapp" placeholder="(00) 00000-0000" maxlength="15" required>

<label>E-mail *</label> <input type="email" id="email" required>

<div class="checkbox">
<input type="checkbox" id="lgpd" required>
<label for="lgpd">Concordo com o tratamento dos meus dados conforme a LGPD.</label>
</div>

<button id="btnSalvar" type="submit">Salvar Cadastro</button>

</form>

<button id="btnEnviar" type="button" onclick="enviarPendentes()">
Enviar Cadastros Pendentes
</button>

<button id="btnLimpar" type="button" onclick="limparPendentes()">
Limpar Cadastros Pendentes
</button>

<div class="status" id="status"></div>

</div>

<!-- Pop-up Modal de Sucesso/Alerta em Destaque -->
<div id="modalSucesso" class="modal-sucesso">
  <div class="modal-conteudo">
    <div class="icone-sucesso" id="iconeModal">✓</div>
    <h2 id="tituloModal">Cadastro Concluído!</h2>
    <p id="msgModal">Seu cadastro foi realizado com sucesso.</p>
    <button type="button" class="btn-fechar-modal" onclick="fecharModalSucesso()">Continuar</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxcFcKBO39I7UibZoFiPz3a1TZIpXtN5kGK0XnFJu-P-yfMhpCcGCMZIE2LmGtnD-qFqw/exec";

/* VALIDAÇÃO MATEMÁTICA DE CPF */
function validarCPF(cpf) {
  cpf = cpf.replace(/[^\d]+/g, '');
  if (cpf === '') return true; // Se o campo for opcional e estiver vazio, ignora
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;

  let soma = 0;
  let resto;

  for (let i = 1; i <= 9; i++) {
    soma += parseInt(cpf.substring(i - 1, i)) * (11 - i);
  }
  resto = (soma * 10) % 11;
  if ((resto === 10) || (resto === 11)) resto = 0;
  if (resto !== parseInt(cpf.substring(9, 10))) return false;

  soma = 0;
  for (let i = 1; i <= 10; i++) {
    soma += parseInt(cpf.substring(i - 1, i)) * (12 - i);
  }
  resto = (soma * 10) % 11;
  if ((resto === 10) || (resto === 11)) resto = 0;
  if (resto !== parseInt(cpf.substring(10, 11))) return false;

  return true;
}

/* MÁSCARAS AUTOMÁTICAS */
function aplicarMascaraCPF(v){
  v = v.replace(/\D/g, "");
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d)/, "$1.$2");
  v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  return v;
}

function aplicarMascaraTelefone(v){
  v = v.replace(/\D/g, "");
  v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
  v = v.replace(/(\d{4})(\d)/, "$1-$2");
  return v;
}

function aplicarMascaraCelular(v){
  v = v.replace(/\D/g, "");
  v = v.replace(/^(\d{2})(\d)/g, "($1) $2");
  v = v.replace(/(\d{5})(\d)/, "$1-$2");
  return v;
}

function aplicarMascaraCEP(v){
  v = v.replace(/\D/g, "");
  v = v.replace(/^(\d{5})(\d)/, "$1-$2");
  return v;
}

/* OUVINTES DE MÁSCARA NOS INPUTS */
document.getElementById("cpf").addEventListener("input", function(e){
  e.target.value = aplicarMascaraCPF(e.target.value);
});

document.getElementById("whatsapp").addEventListener("input", function(e){
  e.target.value = aplicarMascaraCelular(e.target.value);
});

document.getElementById("telefone").addEventListener("input", function(e){
  e.target.value = aplicarMascaraTelefone(e.target.value);
});

document.getElementById("cep").addEventListener("input", function(e){
  e.target.value = aplicarMascaraCEP(e.target.value);
});

/* BUSCA AUTOMÁTICA DE ENDEREÇO PELO CEP */
document.getElementById("cep").addEventListener("blur", async function(e){
  const cep = e.target.value.replace(/\D/g, "");
  if(cep.length === 8){
    try {
      const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
      const data = await res.json();
      if(!data.erro){
        document.getElementById("endereco").value = data.logradouro || "";
        document.getElementById("bairro").value = data.bairro || "";
        document.getElementById("cidade").value = data.localidade || "";
        document.getElementById("estado").value = data.uf || "";
      }
    } catch(err){
      console.log("Erro ao buscar CEP:", err);
    }
  }
});

/* GERENCIAMENTO DE CADASTROS */
function getPendentes(){
  return JSON.parse(localStorage.getItem("cadastrosPendentes") || "[]");
}

function setPendentes(lista){
  localStorage.setItem("cadastrosPendentes", JSON.stringify(lista));
}

function atualizarStatusSync(){
  const qtd = getPendentes().length;
  const el = document.getElementById("syncStatus");

  if(navigator.onLine){
    el.innerHTML = "Online • " + qtd + " cadastro(s) pendente(s)";
  }else{
    el.innerHTML = "Sem internet • " + qtd + " cadastro(s) pendente(s)";
  }
}

function obterCadastro(){
  return {
    nome: document.getElementById("nome").value,
    titulo: document.getElementById("titulo").value,
    zona: document.getElementById("zona").value,
    secao: document.getElementById("secao").value,
    cpf: document.getElementById("cpf").value,
    nascimento: document.getElementById("nascimento").value,
    mae: document.getElementById("mae").value,
    pai: document.getElementById("pai").value,
    estadoCivil: document.getElementById("estadoCivil").value,
    genero: document.getElementById("genero").value,
    cep: document.getElementById("cep").value,
    endereco: document.getElementById("endereco").value,
    numero: document.getElementById("numero").value,
    complemento: document.getElementById("complemento").value,
    bairro: document.getElementById("bairro").value,
    cidade: document.getElementById("cidade").value,
    estado: document.getElementById("estado").value,
    telefone: document.getElementById("telefone").value,
    whatsapp: document.getElementById("whatsapp").value,
    email: document.getElementById("email").value
  };
}

async function enviarCadastro(cadastro){
  await fetch(API_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(cadastro)
  });
}

function exibirModal(titulo, mensagemTexto, tipo = "sucesso") {
  const iconeEl = document.getElementById("iconeModal");
  const tituloEl = document.getElementById("tituloModal");
  const msgEl = document.getElementById("msgModal");

  tituloEl.innerText = titulo;
  msgEl.innerText = mensagemTexto;

  if (tipo === "erro") {
    iconeEl.innerText = "✕";
    iconeEl.classList.add("icone-erro");
  } else {
    iconeEl.innerText = "✓";
    iconeEl.classList.remove("icone-erro");
  }

  document.getElementById("modalSucesso").classList.add("ativo");
}

function fecharModalSucesso(){
  document.getElementById("modalSucesso").classList.remove("ativo");
}

document.getElementById("cadastroForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const cpfValue = document.getElementById("cpf").value;
  if (!validarCPF(cpfValue)) {
    exibirModal("CPF Inválido", "Por favor, verifique o número do CPF digitado.", "erro");
    return;
  }

  const cadastro = obterCadastro();

  if(navigator.onLine){
    try{
      await enviarCadastro(cadastro);
      exibirModal("Cadastro Concluído!", "Cadastro enviado com sucesso para o servidor!", "sucesso");
    }catch(err){
      const pendentes = getPendentes();
      pendentes.push(cadastro);
      setPendentes(pendentes);
      exibirModal("Salvo no Aparelho", "Sem comunicação com o servidor. Cadastro salvo no aparelho!", "sucesso");
    }
  }else{
    const pendentes = getPendentes();
    pendentes.push(cadastro);
    setPendentes(pendentes);
    exibirModal("Salvo Offline", "Sem internet no momento. Cadastro salvo no aparelho!", "sucesso");
  }

  this.reset();
  atualizarStatusSync();
});

async function enviarPendentes(){

  if(!navigator.onLine){
    document.getElementById("status").innerHTML =
      "Não há conexão com a internet.";
    return;
  }

  let pendentes = getPendentes();

  if(pendentes.length===0){
    document.getElementById("status").innerHTML =
      "Não existem cadastros pendentes.";
    return;
  }

  let enviados = 0;
  let restantes = [];

  for(const cadastro of pendentes){
    try{
      await enviarCadastro(cadastro);
      enviados++;
    }catch(err){
      restantes.push(cadastro);
    }
  }

  setPendentes(restantes);
  atualizarStatusSync();

  exibirModal("Sincronização Concluída", enviados + " cadastro(s) pendente(s) enviado(s) com sucesso!", "sucesso");
}

function limparPendentes(){
  localStorage.removeItem("cadastrosPendentes");
  atualizarStatusSync();
  document.getElementById("status").innerHTML =
    "Cadastros pendentes removidos.";
}

window.addEventListener("online", atualizarStatusSync);
window.addEventListener("offline", atualizarStatusSync);

atualizarStatusSync();
</script>

</body>
</html>
