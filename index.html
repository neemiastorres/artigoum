<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artigo Um | Tela Inicial</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#0B1F3A">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#f4f6f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
  color:#333;
}

.card{
  width:100%;
  max-width:420px;
  background:#ffffff;
  border-radius:22px;
  box-shadow:0 12px 30px rgba(0,0,0,0.12);
  padding:36px 26px;
  text-align:center;
}

.logo-container{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  width:220px;
  max-width:100%;
  height:auto;
  display:block;
}

h1{
  color:#0B1F3A;
  font-size:28px;
  font-weight:700;
  margin-bottom:8px;
}

.subtitle{
  color:#555;
  font-size:16px;
  font-weight:600;
  margin-bottom:30px;
}

.btn{
  display:block;
  width:100%;
  text-decoration:none;
  color:#fff;
  font-size:17px;
  font-weight:700;
  padding:16px;
  border-radius:12px;
  margin-bottom:15px;
  transition:background .2s ease, transform .1s ease;
  text-align:center;
}

.btn:active{
  transform:scale(0.98);
}

.btn-cadastro{
  background:#7ED957;
}

.btn-cadastro:hover{
  background:#6bc74a;
}

.btn-login{
  background:#0B1F3A;
}

.btn-login:hover{
  background:#13305c;
}

.footer-info{
  margin-top:25px;
  font-size:13px;
  color:#777;
}
</style>

</head>
<body>

<div class="card">

  <div class="logo-container">
    <img src="logo-a1.png" alt="Logo Artigo Um" class="logo">
  </div>

  <h1>Artigo Um</h1>
  <div class="subtitle">Sistema de Cadastro Geral</div>

  <a href="cadastro.html" class="btn btn-cadastro">Fazer Novo Cadastro</a>
  <a href="login.html" class="btn btn-login">Área Administrativa</a>

  <div class="footer-info">
    Aplicativo Oficial - Artigo Um
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('PWA Ativo:', reg))
        .catch((err) => console.log('Erro PWA:', err));
    });
  }
</script>

</body>
</html>
